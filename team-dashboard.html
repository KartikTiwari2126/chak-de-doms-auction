<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chak De DoMS — Team Dashboard</title><style>
:root{--bg:#edf4ed;--ink:#142019;--muted:#68756c;--line:#d6e2d7;--green:#146440;--soft:#e4f1e7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 110%,#dbeadc 0 25%,transparent 48%),linear-gradient(180deg,#f8fbf8,#edf4ed);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Arial}body{position:relative}body:before{content:"";position:fixed;left:-8%;right:-8%;bottom:-48%;height:70%;border:2px solid #cbdccc;border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.7;pointer-events:none}.top{height:62px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{font-size:18px;font-weight:950}.nav{display:flex;gap:7px}.nav a{padding:7px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-size:10px;font-weight:850}.nav a.active{background:var(--green);color:#fff;border-color:var(--green)}.wrap{max-width:none;margin:auto;padding:14px 18px 20px;position:relative;z-index:1}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.eyebrow{font-size:9px;color:var(--green);font-weight:950;letter-spacing:1.5px}.title{font-size:27px;font-weight:950;letter-spacing:-1px;margin-top:2px}.sub{font-size:11px;color:var(--muted);margin-top:4px}.summary{display:flex;gap:8px}.metric{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:11px;padding:8px 12px;min-width:95px}.metric small{display:block;color:var(--muted);font-size:7px;font-weight:850;text-transform:uppercase}.metric b{font-size:17px}.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.team-card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 9px 28px #15261b0b}.team-head{padding:12px 14px;border-bottom:1px solid #e8ece7}.team-title{display:flex;justify-content:space-between;align-items:start}.team-name{font-size:16px;font-weight:950}.count{font-size:8px;color:var(--green);font-weight:950;background:var(--soft);padding:5px 7px;border-radius:99px}.money{display:flex;justify-content:space-between;align-items:end;margin-top:9px}.purse{font-size:21px;font-weight:950}.spent{font-size:9px;color:var(--muted);text-align:right}.bar{height:6px;background:#edf1ed;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--green);transition:.35s}.body{padding:10px 14px}.roles{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap}.role{font-size:8px;font-weight:900;background:#f3f5f2;border-radius:7px;padding:5px 7px}.squad{display:grid;grid-template-columns:1fr;gap:6px;max-height:245px;overflow:auto}.player{display:flex;align-items:center;gap:8px;border:1px solid #e9ede8;border-radius:8px;padding:6px}.avatar{width:52px;height:52px;border-radius:8px;background:#000;display:grid;place-items:center;flex:0 0 auto;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:contain;display:block}.pn{font-size:10px;font-weight:900;line-height:1.15}.pr{font-size:8px;color:var(--muted);margin-top:2px}.price{margin-left:auto;font-size:9px;font-weight:950;white-space:nowrap}.empty{padding:14px 0;color:var(--muted);font-size:9px}.footer{text-align:center;color:var(--muted);font-size:8px;margin-top:9px}@media(max-width:1050px){.teams{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.teams{grid-template-columns:1fr}.hero{display:block}.summary{margin-top:10px}.top{padding:0 12px}.nav a:nth-child(2),.nav a:nth-child(3){display:none}.wrap{padding:10px}.title{font-size:23px}}
</style></head><body><header class="top"><div class="brand">🏏 CHAK DE DOMS 2026</div><nav class="nav"><a href="display.html">Live Display</a><a class="active" href="team-dashboard.html">Teams</a></nav></header><main class="wrap"><section class="hero"><div><div class="eyebrow">LIVE TEAM TRACKER</div><div class="title">Squad & Purse Dashboard</div><div class="sub">Every team's picks, spending and remaining purse — updated live.</div></div><div class="summary"><div class="metric"><small>Players picked</small><b id="picked">0</b></div><div class="metric"><small>Total spent</small><b id="spent">₹0</b></div></div></section><section class="teams" id="teams"></section><div class="footer">🏏 Chak De DoMS 2026 · Live auction data</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.publishableKey);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmt=n=>Number(n||0).toLocaleString('en-IN');const driveId=v=>{const x=String(v??'').trim();if(!x)return '';const m=x.match(/(?:id=|\/d\/)([A-Za-z0-9_-]{10,})/);return m?m[1]:(/^[A-Za-z0-9_-]{10,}$/.test(x)?x:'');};const photo=p=>{const id=driveId(p?.photo_id||p?.photo);return id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w400':''};const photoFallback=id=>id?'https://drive.usercontent.google.com/download?id='+encodeURIComponent(id)+'&export=view&confirm=t':'';let players=[],teams=[],sales=[];
async function refresh(){const [pr,tr,sa]=await Promise.all([sb.from('players').select('*').order('id'),sb.from('teams').select('*').order('id'),sb.from('auction_sales').select('player_id,team_id,price,status').eq('status','sold').order('id')]);if(pr.error||tr.error||sa.error){document.getElementById('teams').innerHTML='<div class="empty">Could not load auction data. Please check the Supabase configuration and database permissions.</div>';return;}players=pr.data||[];teams=tr.data||[];sales=sa.data||[];render();}
function render(){const byId=Object.fromEntries(players.map(p=>[p.id,p]));document.getElementById('picked').textContent=sales.length;document.getElementById('spent').textContent='₹'+fmt(sales.reduce((a,s)=>a+Number(s.price||0),0));document.getElementById('teams').innerHTML=teams.map(t=>{const squad=sales.filter(s=>s.team_id===t.id).map(s=>({...s,p:byId[s.player_id]}));const roles={Batter:0,Bowler:0,'All-rounder':0};squad.forEach(s=>{if(s.p?.skill)roles[s.p.skill]=(roles[s.p.skill]||0)+1});const pct=t.start_purse?Math.max(0,Math.min(100,t.purse/t.start_purse*100)):0;return `<article class="team-card"><div class="team-head"><div class="team-title"><div class="team-name">${esc(t.name)}</div><div class="count">${squad.length} ${squad.length===1?'PLAYER':'PLAYERS'}</div></div><div class="money"><div><div class="purse">₹${fmt(t.purse)}</div><div class="sub">remaining purse</div></div><div class="spent">Spent<br><b>₹${fmt(t.spent)}</b></div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div><div class="body"><div class="roles"><span class="role">BAT ${roles.Batter||0}</span><span class="role">BOWL ${roles.Bowler||0}</span><span class="role">AR ${roles['All-rounder']||0}</span></div><div class="squad">${squad.length?squad.map(s=>{const p=s.p||{};const u=photo(p);return `<div class="player"><div class="avatar">${u?`<img src="${u}" data-fallback="${photoFallback(driveId(p.photo_id||p.photo))}" onerror="if(this.dataset.fallback && this.src!==this.dataset.fallback){this.src=this.dataset.fallback}else{this.remove()}" alt="">`:''}</div><div><div class="pn">${esc(p.name)}</div><div class="pr">${esc(p.skill||'Player')} · Exp ${esc(p.experience)}/5</div></div><div class="price">₹${fmt(s.price)}</div></div>`}).join(''):'<div class="empty">No players picked yet.</div>'}</div></div></article>`}).join('')||'<div class="empty">No teams configured yet.</div>'}
sb.channel('team-dashboard').on('postgres_changes',{event:'*',schema:'public',table:'teams'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'auction_sales'},refresh).subscribe();refresh();
</script></body></html>
