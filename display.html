<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chak De DoMS — Live Display</title><style>
:root{--bg:#edf4ed;--ink:#122019;--muted:#68756c;--line:#d6e2d7;--green:#146440;--soft:#e4f1e7;--red:#c63d34;--gold:#d49a2d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(ellipse at 50% 110%,#d9eadc 0 24%,transparent 45%),linear-gradient(180deg,#f9fbf8,#edf4ed);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Arial;position:relative}body:before{content:"";position:fixed;left:-8%;right:-8%;bottom:-46%;height:72%;border:2px solid #c8dbca;border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.7;pointer-events:none}body:after{content:"🏏";position:fixed;right:20px;bottom:-35px;font-size:190px;opacity:.035;transform:rotate(-18deg);pointer-events:none}.top{height:62px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:relative;z-index:3}.brand{font-size:19px;font-weight:950;letter-spacing:-.5px}.live{font-size:9px;color:var(--green);font-weight:950;letter-spacing:1.5px}.layout{width:100%;height:calc(100vh - 62px);padding:12px 18px 14px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;position:relative;z-index:1}.stage{min-width:0;min-height:0;display:flex;align-items:stretch}.card{width:100%;height:100%;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 60px #15261b12;display:flex;flex-direction:row;position:relative}.photo{flex:1 1 57%;min-width:0;background:linear-gradient(145deg,#e2eee3,#fafcf9);position:relative;display:grid;place-items:center;overflow:hidden}.photo:before{content:"";position:absolute;width:80%;height:80%;border:1px solid #cfdfd1;border-radius:50%;opacity:.8}.photo img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}.initials{font-size:min(12vw,120px);font-weight:950;color:#78927e;position:relative;z-index:0}.badge{position:absolute;top:15px;left:16px;background:#fff;border:1px solid #dce7dd;padding:7px 10px;border-radius:99px;font-size:9px;font-weight:950;z-index:2}.info{flex:1 1 43%;min-width:280px;padding:34px 34px;display:flex;flex-direction:column;justify-content:center}.no{font-size:9px;color:var(--muted);font-weight:950;letter-spacing:1.5px}.name{font-size:clamp(32px,3.7vw,58px);line-height:.98;font-weight:950;margin-top:5px;letter-spacing:-1.5px}.role{color:var(--green);font-size:12px;font-weight:900;margin-top:8px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.fact{background:#f2f6f2;border:1px solid #e4ebe4;border-radius:9px;padding:9px 10px}.fact small{display:block;font-size:7px;color:var(--muted);text-transform:uppercase}.fact b{font-size:11px}.state{margin-top:13px;display:inline-block;align-self:flex-start;border-radius:99px;padding:7px 11px;background:var(--soft);color:var(--green);font-size:9px;font-weight:950;letter-spacing:.8px}.state.sold{background:#dff0e2}.state.unsold{background:#fae8e5;color:var(--red)}.side{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px #15261b0d;overflow:hidden;min-height:0;display:flex;flex-direction:column}.head{padding:12px 14px;border-bottom:1px solid #e7ece6;font-size:10px;font-weight:950;letter-spacing:.3px}.team{padding:12px 13px;border-bottom:1px solid #edf0eb}.line{display:flex;justify-content:space-between;align-items:center}.purse{font-size:17px;font-weight:950}.bar{height:6px;background:#edf1ed;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--green);transition:.3s}.small{font-size:9px;color:var(--muted)}#teams{overflow:auto;min-height:0}.empty{text-align:center;padding:30px}.big{font-size:25px;font-weight:950;margin-bottom:7px}.history{display:none}#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}@media(max-width:900px){html,body{overflow:auto}.layout{height:auto;grid-template-columns:1fr}.side{display:none}.card{min-height:calc(100vh - 100px)}.photo{min-height:330px}.info{padding:25px;min-width:0}}@media(max-width:650px){.top{padding:0 13px}.brand{font-size:15px}.live{font-size:8px}.layout{padding:10px}.card{display:block}.photo{height:55vh}.info{height:auto}.name{font-size:32px}}
</style></head><body><header class="top"><div class="brand">🏏 CHAK DE DOMS 2026</div><div class="live">● LIVE AUCTION · CRICKET ARENA</div></header><canvas id="confetti"></canvas><main class="layout"><section class="stage"><div class="card" id="card"></div></section><aside class="side"><div class="head">💰 LIVE TEAM PURSE</div><div id="teams"></div></aside></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.publishableKey);
const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt = n => Number(n||0).toLocaleString('en-IN');
const photoUrl = p => p?.photo_id ? 'https://drive.google.com/thumbnail?id='+encodeURIComponent(p.photo_id)+'&sz=w1400' : '';
const initials = n => String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
</script><script>
let players=[],state=null,teams=[],sales=[],hasRendered=false,previousState=null,confettiTimer=null;
async function load(){players=(await sb.from('players').select('*').order('id')).data||[];await refresh();hasRendered=true;}
async function refresh(){teams=(await sb.from('teams').select('*').order('id')).data||[];sales=(await sb.from('auction_sales').select('team_id,status').eq('status','sold')).data||[];const next=(await sb.from('auction_state').select('*').eq('id',1).single()).data;if(hasRendered && next?.stage==='sold' && (previousState?.stage!=='sold' || previousState?.current_player_id!==next?.current_player_id)){launchConfetti();}previousState=next;state=next;render();}
function launchConfetti(){const c=document.getElementById('confetti'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const pieces=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.35,vx:(Math.random()-.5)*7,vy:3+Math.random()*6,r:4+Math.random()*6,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:100+Math.random()*70}));let frame=0;cancelAnimationFrame(confettiTimer);function tick(){ctx.clearRect(0,0,c.width,c.height);pieces.forEach(q=>{q.x+=q.vx;q.vy+=.08;q.y+=q.vy;q.rot+=q.vr;q.life--;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.fillStyle=`hsl(${Math.random()*360},80%,55%)`;ctx.fillRect(-q.r/2,-q.r/2,q.r,q.r*1.8);ctx.restore();});if(frame++<150){confettiTimer=requestAnimationFrame(tick)}else ctx.clearRect(0,0,c.width,c.height);}tick();setTimeout(()=>{cancelAnimationFrame(confettiTimer);ctx.clearRect(0,0,c.width,c.height)},4200);}
function render(){let p=state?.current_player_id?players.find(x=>x.id===state.current_player_id):null,st=state?.stage||'ready';if(!p)document.getElementById('card').innerHTML='<div class="empty"><div class="big">READY FOR THE NEXT PLAYER</div><div class="small">The auction team will reveal the next player here.</div></div>';else{let u=photoUrl(p),label=st==='sold'?'SOLD':st==='unsold'?'UNSOLD':'ON AUCTION';document.getElementById('card').innerHTML=`<div class="photo"><div class="initials">${initials(p.name)}</div>${u?`<img src="${u}" onerror="this.remove()" alt="">`:''}<div class="badge">${esc(p.skill)}</div></div><div class="info"><div class="no">PLAYER ${String(players.findIndex(x=>x.id===p.id)+1).padStart(2,'0')}</div><div class="name">${esc(p.name)}</div><div class="role">${esc(p.program)} · ${esc(p.gender)}</div><div class="facts"><div class="fact"><small>Roll No.</small><b>${esc(p.roll)}</b></div><div class="fact"><small>Experience</small><b>${p.experience}/5</b></div><div class="fact"><small>Skill</small><b>${esc(p.skill)}</b></div></div><div class="state ${st}">${label}${state.sale_price!=null?' · ₹'+fmt(state.sale_price):''}</div></div>`}document.getElementById('teams').innerHTML=teams.map(t=>{const count=sales.filter(x=>x.team_id===t.id).length;return `<div class="team"><div class="line"><b style="font-size:12px">${esc(t.name)}</b><span class="purse">₹${fmt(t.purse)}</span></div><div class="bar"><div class="fill" style="width:${t.start_purse?Math.max(0,t.purse/t.start_purse*100):0}%"></div></div><div class="small">${count} ${count===1?'player':'players'} picked</div></div>`}).join('')}
sb.channel('auction-live-display').on('postgres_changes',{event:'*',schema:'public',table:'auction_state'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'teams'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'auction_sales'},refresh).subscribe();load();
</script></body></html>
