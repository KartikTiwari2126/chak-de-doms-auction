<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chak De DoMS — Live Display</title>
<style>
:root{--bg:#f2f6f1;--ink:#142019;--muted:#6b756e;--line:#dce4dc;--green:#17633f;--soft:#e4f0e8;--red:#c63c32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Arial;min-height:100vh}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{font-size:20px;font-weight:950}.live{font-size:10px;color:var(--green);font-weight:950;letter-spacing:1.5px}.layout{max-width:1500px;margin:auto;padding:25px;display:grid;grid-template-columns:minmax(600px,1fr) 320px;gap:25px;min-height:calc(100vh - 74px)}.stage{display:flex;align-items:center;justify-content:center}.card{width:min(900px,100%);background:#fff;border:1px solid var(--line);border-radius:25px;overflow:hidden;box-shadow:0 22px 70px #15261b16}.photo{height:470px;background:linear-gradient(145deg,#e7eee7,#fbfcfa);position:relative;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.initials{font-size:120px;font-weight:950;color:#78927e}.badge{position:absolute;top:18px;left:18px;background:#fffef0;border:1px solid #e7e3c6;padding:8px 12px;border-radius:99px;font-size:11px;font-weight:950}.info{padding:24px 30px 27px}.no{font-size:10px;color:var(--muted);font-weight:950;letter-spacing:1.5px}.name{font-size:44px;line-height:1.04;font-weight:950;margin-top:6px;letter-spacing:-1.2px}.role{color:var(--green);font-size:13px;font-weight:900;margin-top:8px}.facts{display:flex;gap:9px;margin-top:18px}.fact{background:#f2f5f1;border-radius:10px;padding:10px 13px}.fact small{display:block;font-size:8px;color:var(--muted);text-transform:uppercase}.fact b{font-size:12px}.state{margin-top:15px;display:inline-block;border-radius:99px;padding:7px 11px;background:var(--soft);color:var(--green);font-size:10px;font-weight:950;letter-spacing:.8px}.state.sold{background:#e1f0e2}.state.unsold{background:#fae8e5;color:var(--red)}.side{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px #15261b0d;overflow:hidden;height:max-content}.head{padding:15px 17px;border-bottom:1px solid #e7ece6;font-size:12px;font-weight:950}.team{padding:14px;border-bottom:1px solid #edf0eb}.line{display:flex;justify-content:space-between;align-items:center}.purse{font-size:21px;font-weight:950}.bar{height:8px;background:#edf1ed;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--green);transition:.3s}.empty{text-align:center;padding:135px 30px}.big{font-size:26px;font-weight:950;margin-bottom:8px}.small{font-size:12px;color:var(--muted)}@media(max-width:950px){.layout{grid-template-columns:1fr}.side{display:none}.photo{height:400px}}@media(max-width:600px){.top{padding:0 15px}.brand{font-size:16px}.layout{padding:12px}.photo{height:320px}.name{font-size:32px}}
</style></head><body><header class="top"><div class="brand">🏏 CHAK DE DOMS 2026</div><div class="live">● LIVE AUCTION DISPLAY</div></header>
<main class="layout"><section class="stage"><div class="card" id="card"></div></section><aside class="side"><div class="head">LIVE TEAM PURSE</div><div id="teams"></div></aside></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.publishableKey);
const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt = n => Number(n||0).toLocaleString('en-IN');
const photoUrl = p => p?.photo_id ? 'https://drive.google.com/thumbnail?id='+encodeURIComponent(p.photo_id)+'&sz=w1400' : '';
const initials = n => String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
</script>
<script>
let players=[],state=null,teams=[];
async function load(){players=(await sb.from('players').select('*').order('id')).data||[];await refresh();}
async function refresh(){teams=(await sb.from('teams').select('*').order('id')).data||[];state=(await sb.from('auction_state').select('*').eq('id',1).single()).data;render();}
function render(){let p=state?.current_player_id?players.find(x=>x.id===state.current_player_id):null,st=state?.stage||'ready';if(!p)document.getElementById('card').innerHTML='<div class="empty"><div class="big">READY FOR THE NEXT PLAYER</div><div class="small">The auction team will reveal the next player here.</div></div>';else{let u=photoUrl(p),label=st==='sold'?'SOLD':st==='unsold'?'UNSOLD':'ON AUCTION';document.getElementById('card').innerHTML=`<div class="photo"><div class="initials">${initials(p.name)}</div>${u?`<img src="${u}" onerror="this.remove()" alt="">`:''}<div class="badge">${esc(p.skill)}</div></div><div class="info"><div class="no">PLAYER ${String(players.findIndex(x=>x.id===p.id)+1).padStart(2,'0')}</div><div class="name">${esc(p.name)}</div><div class="role">${esc(p.program)} · ${esc(p.gender)}</div><div class="facts"><div class="fact"><small>Roll No.</small><b>${esc(p.roll)}</b></div><div class="fact"><small>Experience</small><b>${p.experience}/5</b></div><div class="fact"><small>Skill</small><b>${esc(p.skill)}</b></div></div><div class="state ${st}">${label}${state.sale_price!=null?' · ₹'+fmt(state.sale_price):''}</div></div>`}document.getElementById('teams').innerHTML=teams.map(t=>`<div class="team"><div class="line"><b style="font-size:12px">${esc(t.name)}</b><span class="purse">₹${fmt(t.purse)}</span></div><div class="bar"><div class="fill" style="width:${t.start_purse?Math.max(0,t.purse/t.start_purse*100):0}%"></div></div></div>`).join('')}
sb.channel('auction-live-display').on('postgres_changes',{event:'*',schema:'public',table:'auction_state'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'teams'},refresh).subscribe();load();
</script></body></html>
