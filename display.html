<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chak De DoMS — Live Display</title>

<style>
:root{
  --bg:#edf4ed;
  --ink:#122019;
  --muted:#68756c;
  --line:#d6e2d7;
  --green:#146440;
  --soft:#e4f1e7;
  --red:#c63d34;
  --gold:#d49a2d;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:
    radial-gradient(
      ellipse at 50% 110%,
      #d9eadc 0 24%,
      transparent 45%
    ),
    linear-gradient(
      180deg,
      #f9fbf8,
      #edf4ed
    );
  color:var(--ink);
  font-family:Inter,system-ui,Segoe UI,Arial;
  position:relative;
}

body:before{
  content:"";
  position:fixed;
  left:-8%;
  right:-8%;
  bottom:-46%;
  height:72%;
  border:2px solid #c8dbca;
  border-radius:50% 50% 0 0/100% 100% 0 0;
  opacity:.7;
  pointer-events:none;
}

body:after{
  content:"🏏";
  position:fixed;
  right:20px;
  bottom:-35px;
  font-size:190px;
  opacity:.035;
  transform:rotate(-18deg);
  pointer-events:none;
}

/* TOP BAR */

.top{
  height:62px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:relative;
  z-index:3;
}

.brand{
  font-size:19px;
  font-weight:950;
  letter-spacing:-.5px;
}

.live{
  font-size:10px;
  color:var(--green);
  font-weight:950;
  letter-spacing:1.5px;
}

/* MAIN LAYOUT */

.layout{
  width:100%;
  height:calc(100vh - 62px);
  padding:12px 18px 14px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 300px;
  gap:14px;
  position:relative;
  z-index:1;
}

.stage{
  min-width:0;
  min-height:0;
  display:flex;
  align-items:stretch;
}

/* MAIN PLAYER CARD */

.card{
  width:100%;
  height:100%;
  background:rgba(255,255,255,.97);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 18px 60px #15261b12;
  display:flex;
  flex-direction:row;
  position:relative;
}

/* PLAYER PHOTO
   Same formatting philosophy as Admin panel:
   light green background + complete image visible
*/

.photo{
  flex:0 0 57%;
  min-width:0;
  background:#e5eee7;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/*
  Complete image is always shown.
  Nothing gets cropped.
*/

.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  position:relative;
  z-index:1;
}

/* Decorative cricket/stadium circle */

.photo:before{
  content:"";
  position:absolute;
  width:80%;
  height:80%;
  border:1px solid #cfdfd1;
  border-radius:50%;
  opacity:.8;
  pointer-events:none;
  z-index:0;
}

/* Skill badge */

.badge{
  position:absolute;
  top:15px;
  left:16px;
  background:#fff;
  border:1px solid #dce7dd;
  padding:8px 11px;
  border-radius:99px;
  font-size:12px;
  font-weight:950;
  z-index:2;
}

/* PLAYER INFORMATION */

.info{
  flex:1 1 43%;
  min-width:280px;
  padding:34px 34px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.no{
  font-size:12px;
  color:var(--muted);
  font-weight:950;
  letter-spacing:1.5px;
}

.name{
  font-size:clamp(32px,3.7vw,58px);
  line-height:.98;
  font-weight:950;
  margin-top:5px;
  letter-spacing:-1.5px;
}

.role{
  color:var(--green);
  font-size:16px;
  font-weight:900;
  margin-top:8px;
}

.facts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:16px;
}

.fact{
  background:#f2f6f2;
  border:1px solid #e4ebe4;
  border-radius:9px;
  padding:10px 11px;
}

.fact small{
  display:block;
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:2px;
}

.fact b{
  font-size:14px;
}

.state{
  margin-top:13px;
  display:inline-block;
  align-self:flex-start;
  border-radius:99px;
  padding:8px 12px;
  background:var(--soft);
  color:var(--green);
  font-size:12px;
  font-weight:950;
  letter-spacing:.8px;
}

.state.sold{
  background:#dff0e2;
}

.state.unsold{
  background:#fae8e5;
  color:var(--red);
}

/* TEAM PURSE SIDEBAR */

.side{
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 12px 40px #15261b0d;
  overflow:hidden;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.head{
  padding:12px 14px;
  border-bottom:1px solid #e7ece6;
  font-size:13px;
  font-weight:950;
  letter-spacing:.3px;
}

.team{
  padding:12px 13px;
  border-bottom:1px solid #edf0eb;
}

.line{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.purse{
  font-size:18px;
  font-weight:950;
}

.bar{
  height:6px;
  background:#edf1ed;
  border-radius:99px;
  overflow:hidden;
  margin-top:7px;
}

.fill{
  height:100%;
  background:var(--green);
  transition:.3s;
}

.small{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

#teams{
  overflow:auto;
  min-height:0;
}

/* EMPTY / NEXT PLAYER STATE */

.empty{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.card.empty-card{
  justify-content:center;
  align-items:center;
}

.card.empty-card .empty{
  min-height:100%;
}

.big{
  font-size:28px;
  font-weight:950;
  margin-bottom:8px;
}

.history{
  display:none;
}

/* CONFETTI */

#confetti{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:9999;
}

/* TABLET */

@media(max-width:900px){

  html,body{
    overflow:auto;
  }

  .layout{
    height:auto;
    grid-template-columns:1fr;
  }

  .side{
    display:none;
  }

  .card{
    min-height:calc(100vh - 100px);
  }

  .photo{
    min-height:330px;
  }

  .info{
    padding:25px;
    min-width:0;
  }
}

/* MOBILE */

@media(max-width:650px){

  .top{
    padding:0 13px;
  }

  .brand{
    font-size:15px;
  }

  .live{
    font-size:8px;
  }

  .layout{
    padding:10px;
  }

  .card{
    display:block;
  }

  .photo{
    height:55vh;
  }

  .info{
    height:auto;
  }

  .name{
    font-size:32px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="brand">🏏 CHAK DE DOMS 2026</div>
  <div class="live">● LIVE AUCTION · CRICKET ARENA</div>
</header>

<canvas id="confetti"></canvas>

<main class="layout">

  <section class="stage">
    <div class="card" id="card"></div>
  </section>

  <aside class="side">
    <div class="head">💰 LIVE TEAM PURSE</div>
    <div id="teams"></div>
  </aside>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const sb = supabase.createClient(
  window.SUPABASE_CONFIG.url,
  window.SUPABASE_CONFIG.publishableKey
);

const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

const fmt = n =>
  Number(n || 0).toLocaleString('en-IN');


/* GOOGLE DRIVE IMAGE HELPERS */

const driveId = v => {

  const x = String(v ?? '').trim();

  if(!x) return '';

  const m = x.match(
    /(?:id=|\/d\/)([A-Za-z0-9_-]{10,})/
  );

  return m
    ? m[1]
    : (/^[A-Za-z0-9_-]{10,}$/.test(x) ? x : '');
};


const photoUrl = p => {

  const id = driveId(
    p?.photo_id || p?.photo
  );

  return id
    ? 'https://drive.google.com/thumbnail?id=' +
      encodeURIComponent(id) +
      '&sz=w1400'
    : '';
};


const photoFallback = id =>

  id
    ? 'https://drive.usercontent.google.com/download?id=' +
      encodeURIComponent(id) +
      '&export=view&confirm=t'
    : '';


/* STATE */

let players = [];
let state = null;
let teams = [];
let sales = [];

let hasRendered = false;
let previousState = null;
let confettiTimer = null;


/* INITIAL LOAD */

async function load(){

  players =
    (await sb
      .from('players')
      .select('*')
      .order('id')
    ).data || [];

  await refresh();

  hasRendered = true;
}


/* REFRESH LIVE DATA */

async function refresh(){

  teams =
    (await sb
      .from('teams')
      .select('*')
      .order('id')
    ).data || [];


  sales =
    (await sb
      .from('auction_sales')
      .select('team_id,status')
      .eq('status','sold')
    ).data || [];


  const next =
    (await sb
      .from('auction_state')
      .select('*')
      .eq('id',1)
      .single()
    ).data;


  if(
    hasRendered &&
    next?.stage === 'sold' &&
    (
      previousState?.stage !== 'sold' ||
      previousState?.current_player_id !==
      next?.current_player_id
    )
  ){

    launchConfetti();

  }


  previousState = next;
  state = next;

  render();
}


/* CONFETTI */

function launchConfetti(){

  const c =
    document.getElementById('confetti');

  const ctx = c.getContext('2d');

  c.width = innerWidth;
  c.height = innerHeight;


  const pieces =
    Array.from(
      {length:180},
      () => ({
        x:Math.random()*c.width,
        y:-20-Math.random()*c.height*.35,
        vx:(Math.random()-.5)*7,
        vy:3+Math.random()*6,
        r:4+Math.random()*6,
        rot:Math.random()*Math.PI,
        vr:(Math.random()-.5)*.3,
        life:100+Math.random()*70
      })
    );


  let frame = 0;

  cancelAnimationFrame(confettiTimer);


  function tick(){

    ctx.clearRect(
      0,
      0,
      c.width,
      c.height
    );


    pieces.forEach(q => {

      q.x += q.vx;

      q.vy += .08;

      q.y += q.vy;

      q.rot += q.vr;

      q.life--;


      ctx.save();

      ctx.translate(q.x,q.y);

      ctx.rotate(q.rot);

      ctx.fillStyle =
        `hsl(${Math.random()*360},80%,55%)`;

      ctx.fillRect(
        -q.r/2,
        -q.r/2,
        q.r,
        q.r*1.8
      );

      ctx.restore();

    });


    if(frame++ < 150){

      confettiTimer =
        requestAnimationFrame(tick);

    }else{

      ctx.clearRect(
        0,
        0,
        c.width,
        c.height
      );

    }

  }


  tick();


  setTimeout(() => {

    cancelAnimationFrame(confettiTimer);

    ctx.clearRect(
      0,
      0,
      c.width,
      c.height
    );

  },4200);

}


/* RENDER */

function render(){

  const p =
    state?.current_player_id
      ? players.find(
          x => x.id === state.current_player_id
        )
      : null;


  const st =
    state?.stage || 'ready';


  const card =
    document.getElementById('card');


  card.classList.toggle(
    'empty-card',
    !p
  );


  /* NO PLAYER SELECTED */

  if(!p){

    card.innerHTML = `

      <div class="empty">

        <div class="big">
          READY FOR THE NEXT PLAYER
        </div>

        <div class="small">
          The auction team will reveal the next player here.
        </div>

      </div>

    `;

  }

  /* PLAYER SELECTED */

  else{

    const u = photoUrl(p);

    const label =
      st === 'sold'
        ? 'SOLD'
        : st === 'unsold'
          ? 'UNSOLD'
          : 'ON AUCTION';


    card.innerHTML = `

      <div class="photo">

        ${
          u
            ? `
              <img
                src="${u}"
                data-fallback="${photoFallback(
                  driveId(p.photo_id || p.photo)
                )}"
                onerror="
                  if(
                    this.dataset.fallback &&
                    this.src !== this.dataset.fallback
                  ){
                    this.src=this.dataset.fallback
                  }else{
                    this.remove()
                  }
                "
                alt=""
              >
            `
            : ''
        }

        <div class="badge">
          ${esc(p.skill)}
        </div>

      </div>


      <div class="info">

        <div class="no">
          PLAYER ${
            String(
              players.findIndex(
                x => x.id === p.id
              ) + 1
            ).padStart(2,'0')
          }
        </div>


        <div class="name">
          ${esc(p.name)}
        </div>


        <div class="role">
          ${esc(p.program)} · ${esc(p.gender)}
        </div>


        <div class="facts">

          <div class="fact">

            <small>
              Roll No.
            </small>

            <b>
              ${esc(p.roll)}
            </b>

          </div>


          <div class="fact">

            <small>
              Experience
            </small>

            <b>
              ${p.experience}/5
            </b>

          </div>


          <div class="fact">

            <small>
              Skill
            </small>

            <b>
              ${esc(p.skill)}
            </b>

          </div>

        </div>


        <div class="state ${st}">

          ${label}

          ${
            state.sale_price != null
              ? ' · ₹' + fmt(state.sale_price)
              : ''
          }

        </div>

      </div>

    `;

  }


  /* TEAM PURSES */

  document.getElementById('teams').innerHTML =

    teams.map(t => {

      const count =
        sales.filter(
          x => x.team_id === t.id
        ).length;


      const percentage =
        t.start_purse
          ? Math.max(
              0,
              t.purse / t.start_purse * 100
            )
          : 0;


      return `

        <div class="team">

          <div class="line">

            <b style="font-size:14px">
              ${esc(t.name)}
            </b>

            <span class="purse">
              ₹${fmt(t.purse)}
            </span>

          </div>


          <div class="bar">

            <div
              class="fill"
              style="width:${percentage}%"
            ></div>

          </div>


          <div class="small">

            ${count}
            ${count === 1 ? 'player' : 'players'}
            picked

          </div>

        </div>

      `;

    }).join('');

}


/* REALTIME */

sb.channel('auction-live-display')

  .on(
    'postgres_changes',
    {
      event:'*',
      schema:'public',
      table:'auction_state'
    },
    refresh
  )

  .on(
    'postgres_changes',
    {
      event:'*',
      schema:'public',
      table:'teams'
    },
    refresh
  )

  .on(
    'postgres_changes',
    {
      event:'*',
      schema:'public',
      table:'auction_sales'
    },
    refresh
  )

  .subscribe();


load();

</script>

</body>
</html>
