<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chak De DoMS — Live Display</title>
<style>
:root{--bg:#f2f6f1;--ink:#142019;--muted:#6b756e;--line:#dce4dc;--green:#17633f;--soft:#e4f0e8;--red:#c63c32}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Arial}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-size:19px;font-weight:950}.live{font-size:10px;color:var(--green);font-weight:950;letter-spacing:1.5px}.layout{width:100%;height:calc(100vh - 64px);padding:16px 22px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.stage{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}.card{width:min(920px,100%);height:100%;max-height:calc(100vh - 96px);background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 22px 70px #15261b16;display:flex;flex-direction:column}.photo{flex:1 1 auto;min-height:0;background:linear-gradient(145deg,#e7eee7,#fbfcfa);position:relative;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.initials{font-size:min(12vw,120px);font-weight:950;color:#78927e}.badge{position:absolute;top:14px;left:16px;background:#fffef0;border:1px solid #e7e3c6;padding:7px 11px;border-radius:99px;font-size:10px;font-weight:950;z-index:2}.info{flex:0 0 auto;padding:17px 24px 19px}.no{font-size:9px;color:var(--muted);font-weight:950;letter-spacing:1.5px}.name{font-size:clamp(28px,3.4vw,43px);line-height:1.02;font-weight:950;margin-top:4px;letter-spacing:-1px}.role{color:var(--green);font-size:12px;font-weight:900;margin-top:6px}.facts{display:flex;gap:8px;margin-top:11px}.fact{background:#f2f5f1;border-radius:9px;padding:7px 10px}.fact small{display:block;font-size:7px;color:var(--muted);text-transform:uppercase}.fact b{font-size:11px}.state{margin-top:10px;display:inline-block;border-radius:99px;padding:6px 10px;background:var(--soft);color:var(--green);font-size:9px;font-weight:950;letter-spacing:.8px}.state.sold{background:#e1f0e2}.state.unsold{background:#fae8e5;color:var(--red)}.side{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px #15261b0d;overflow:hidden;height:fit-content;max-height:100%;}.head{padding:13px 15px;border-bottom:1px solid #e7ece6;font-size:11px;font-weight:950}.team{padding:12px 13px;border-bottom:1px solid #edf0eb}.line{display:flex;justify-content:space-between;align-items:center}.purse{font-size:18px;font-weight:950}.bar{height:7px;background:#edf1ed;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:var(--green);transition:.3s}.empty{text-align:center;padding:30px}.big{font-size:25px;font-weight:950;margin-bottom:7px}.small{font-size:11px;color:var(--muted)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}@media(max-width:950px){html,body{overflow:auto}.layout{height:auto;min-height:calc(100vh - 64px);grid-template-columns:1fr}.side{display:none}.card{height:calc(100vh - 96px);min-height:520px}.photo{min-height:280px}}@media(max-width:600px){.top{padding:0 15px}.brand{font-size:15px}.layout{padding:10px}.card{height:calc(100vh - 84px);min-height:500px}.photo{min-height:230px}.name{font-size:30px}}
</style></head><body><header class="top"><div class="brand">🏏 CHAK DE DOMS 2026</div><div class="live">● LIVE AUCTION DISPLAY</div></header>
<canvas id="confetti"></canvas><main class="layout"><section class="stage"><div class="card" id="card"></div></section><aside class="side"><div class="head">LIVE TEAM PURSE</div><div id="teams"></div></aside></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.publishableKey);
const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt = n => Number(n||0).toLocaleString('en-IN');
const photoUrl = p => p?.photo_id ? 'https://drive.google.com/thumbnail?id='+encodeURIComponent(p.photo_id)+'&sz=w1400' : '';
const initials = n => String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
</script>
<script>
let players=[],state=null,teams=[],hasRendered=false,previousState=null,confettiTimer=null;
async function load(){players=(await sb.from('players').select('*').order('id')).data||[];await refresh();hasRendered=true;}
async function refresh(){teams=(await sb.from('teams').select('*').order('id')).data||[];const next=(await sb.from('auction_state').select('*').eq('id',1).single()).data;if(hasRendered && next?.stage==='sold' && (previousState?.stage!=='sold' || previousState?.current_player_id!==next?.current_player_id)){launchConfetti();}previousState=next;state=next;render();}
function launchConfetti(){const c=document.getElementById('confetti'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const pieces=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.35,vx:(Math.random()-.5)*7,vy:3+Math.random()*6,r:4+Math.random()*6,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:100+Math.random()*70}));let frame=0;cancelAnimationFrame(confettiTimer);function tick(){ctx.clearRect(0,0,c.width,c.height);pieces.forEach(q=>{q.x+=q.vx;q.vy+=.08;q.y+=q.vy;q.rot+=q.vr;q.life--;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.fillStyle=`hsl(${Math.random()*360},80%,55%)`;ctx.fillRect(-q.r/2,-q.r/2,q.r,q.r*1.8);ctx.restore();});if(frame++<150){confettiTimer=requestAnimationFrame(tick)}else ctx.clearRect(0,0,c.width,c.height);}tick();setTimeout(()=>{cancelAnimationFrame(confettiTimer);ctx.clearRect(0,0,c.width,c.height)},4200);}
function render(){let p=state?.current_player_id?players.find(x=>x.id===state.current_player_id):null,st=state?.stage||'ready';if(!p)document.getElementById('card').innerHTML='<div class="empty"><div class="big">READY FOR THE NEXT PLAYER</div><div class="small">The auction team will reveal the next player here.</div></div>';else{let u=photoUrl(p),label=st==='sold'?'SOLD':st==='unsold'?'UNSOLD':'ON AUCTION';document.getElementById('card').innerHTML=`<div class="photo"><div class="initials">${initials(p.name)}</div>${u?`<img src="${u}" onerror="this.remove()" alt="">`:''}<div class="badge">${esc(p.skill)}</div></div><div class="info"><div class="no">PLAYER ${String(players.findIndex(x=>x.id===p.id)+1).padStart(2,'0')}</div><div class="name">${esc(p.name)}</div><div class="role">${esc(p.program)} · ${esc(p.gender)}</div><div class="facts"><div class="fact"><small>Roll No.</small><b>${esc(p.roll)}</b></div><div class="fact"><small>Experience</small><b>${p.experience}/5</b></div><div class="fact"><small>Skill</small><b>${esc(p.skill)}</b></div></div><div class="state ${st}">${label}${state.sale_price!=null?' · ₹'+fmt(state.sale_price):''}</div></div>`}document.getElementById('teams').innerHTML=teams.map(t=>`<div class="team"><div class="line"><b style="font-size:12px">${esc(t.name)}</b><span class="purse">₹${fmt(t.purse)}</span></div><div class="bar"><div class="fill" style="width:${t.start_purse?Math.max(0,t.purse/t.start_purse*100):0}%"></div></div></div>`).join('')}
sb.channel('auction-live-display').on('postgres_changes',{event:'*',schema:'public',table:'auction_state'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'teams'},refresh).subscribe();load();
</script></body></html>
